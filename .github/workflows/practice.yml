name: GUTHUB ACTION PRACTICE
on:
  workflow_dispatch
jobs:
  job1:
    name: testing
    runs-on: ubuntu-latest
    steps:
      - name: first step
        run: | 
          mkdir player
          echo "Good Morning DevOps Engineer" >> player/greet.txt
          echo "Last echoed message" >> name.txt
          hostname
      - name: second job
        uses: actions/checkout@v7
      - name: step 3
        run: ls -la
      - name: upload_file
        uses: actions/upload-artifact@v7
        with:
          name: single_file
          path: name.txt
      - name: download_artifact
        uses: actions/download-artifact@v7
        with:
          name: single_file
