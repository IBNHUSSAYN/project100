name: GUTHUB ACTION PRACTICE
on:
  push
jobs:
  unit_tests:
    name: Running Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: set-up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Run Unit tetst
        run: pytest -v
          
